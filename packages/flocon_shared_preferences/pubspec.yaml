name: flocon_shared_preferences
description: Shows and edits your SharedPreferences in the Flocon desktop debugger.
repository: https://github.com/openflocon/FloconFlutter/tree/main/packages/flocon_shared_preferences
issue_tracker: https://github.com/openflocon/FloconFlutter/issues
topics:
  - debugging
  - devtools
  - shared-preferences
  - flocon
version: 2.0.0

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flocon: ^2.0.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Local development only, ignored by pub.dev: use the sibling flocon package.
dependency_overrides:
  flocon:
    path: ../flocon
