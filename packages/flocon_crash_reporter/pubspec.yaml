name: flocon_crash_reporter
description: Crash reporter plugin for Flocon, sends the errors of your Flutter app to the Flocon desktop debugger.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flocon:
    path: ../flocon
  path_provider: ^2.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
