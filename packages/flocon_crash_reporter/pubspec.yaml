name: flocon_crash_reporter
description: Crash reporter plugin for Flocon, sends the errors of your Flutter app to the Flocon desktop debugger.
repository: https://github.com/openflocon/FloconFlutter/tree/main/packages/flocon_crash_reporter
issue_tracker: https://github.com/openflocon/FloconFlutter/issues
topics:
  - debugging
  - devtools
  - crash-reporting
  - flocon
version: 2.0.0

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flocon: ^2.0.0
  path_provider: ^2.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Local development only, ignored by pub.dev: use the sibling flocon package.
dependency_overrides:
  flocon:
    path: ../flocon
