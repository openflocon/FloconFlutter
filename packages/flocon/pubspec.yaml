name: flocon
description: Flocon SDK for Flutter - sends your app's network calls, analytics events and tables to the Flocon desktop debugger.
repository: https://github.com/openflocon/FloconFlutter/tree/main/packages/flocon
issue_tracker: https://github.com/openflocon/FloconFlutter/issues
topics:
  - debugging
  - devtools
  - network
  - analytics
  - flocon
version: 2.0.1
# Self-signed key of the TLS test server, not a secret.
false_secrets:
  - /test/fixtures/test_key.pem

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  uuid: ^4.6.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.openflocon.flocon
        pluginClass: FloconNativePlugin
      ios:
        pluginClass: FloconNativePlugin
      macos:
        pluginClass: FloconNativePlugin
      linux:
        dartPluginClass: FloconDartPlugin
      windows:
        dartPluginClass: FloconDartPlugin

