name: flocon_database
description: Browse and query the SQLite databases of your app from the Flocon desktop debugger.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flocon:
    path: ../flocon
  path: ^1.9.0
  path_provider: ^2.1.0
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
