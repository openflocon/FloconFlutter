name: flocon_database
description: Browse and query the SQLite databases of your app from the Flocon desktop debugger.
repository: https://github.com/openflocon/FloconFlutter/tree/main/packages/flocon_database
issue_tracker: https://github.com/openflocon/FloconFlutter/issues
topics:
  - debugging
  - devtools
  - sqlite
  - database
  - flocon
version: 0.0.1

environment:
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flocon: ^0.0.1
  path: ^1.9.0
  path_provider: ^2.1.0
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

# Local development only, ignored by pub.dev: use the sibling flocon package.
dependency_overrides:
  flocon:
    path: ../flocon
